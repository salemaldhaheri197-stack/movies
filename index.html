<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movie & TV Voice Agent</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>🎬 Movie & TV Voice Agent</h1>
    <p class="subtitle">Ask me about any movie or TV episode — try "What happens in Breaking Bad season 3 episode 7?"</p>

    <button id="talkBtn" class="talk-btn">🎙️ Start Talking</button>
    <p id="status" class="status">Idle</p>

    <div id="transcript" class="transcript"></div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
